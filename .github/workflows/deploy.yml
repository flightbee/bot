name: Deploy bot

on:
  push:
    branches:
      - main

jobs:
  eslint:
    name: Run ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

  deploy:
    name: Deploy to remote server
    runs-on: ubuntu-latest
    needs: eslint

    env:
      DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/bot:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Уведомление в Telegram о начале деплоя
        uses: appleboy/telegram-action@v0.1.0
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: |
            Начался процесс деплоя
            Репозиторий: ${{ github.repository }}
            Ветка: ${{ github.ref_name }}

      - name: Логин в DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Сборка Docker образа
        run: |
          docker build -t $DOCKER_IMAGE .
      
      - name: Загрузка образа в DockerHub
        run: |
          docker push $DOCKER_IMAGE

      - name: Настройка SSH
        run: |
          echo "${{ secrets.GCP_SSH_KEY }}" > key.pem
          chmod 600 key.pem
      
      - name: Получение IP с сервера через SSH
        run: |
          # Получаем IP из inventory файла на сервере
          IP=$(ssh -o StrictHostKeyChecking=no -i key.pem ${{ secrets.GCP_USER }}@${{ secrets.SERVER_IP }} \
            "grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' ~/infra/ansible/inventory | head -n 1")
          
          if [ -z "$IP" ]; then
            echo "Ошибка: Не удалось получить IP с сервера"
            exit 1
          fi
          
          echo "Найден IP: $IP"
          echo "IP=$IP" >> $GITHUB_ENV
      
      - name: Деплой через SSH
        run: |
          ssh -o StrictHostKeyChecking=no -i key.pem ${{ secrets.GCP_USER }}@$IP << EOF
          echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
          docker compose -f ~/bot/docker-compose.yml down || true
          cd ~/bot
          git pull origin main
          docker compose -f ~/bot/docker-compose.yml up -d --build
          EOF
      
      - name: Уведомление в Telegram о завершении деплоя
        if: always()
        uses: appleboy/telegram-action@v0.1.0
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: |
            ${{ job.status == 'success' && 'Деплой успешно завершен!' || 'Деплой завершился с ошибкой.' }}
            Статус: ${{ job.status }}
