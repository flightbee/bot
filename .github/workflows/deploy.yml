name: Deploy bot

on:
  push:
    branches:
      - main

jobs:
  eslint:
    name: Run ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

  deploy:
    name: Deploy to remote server
    runs-on: ubuntu-latest
    needs: eslint

    env:
      DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/bot:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Notify Telegram Deployment Start
        uses: dawidd6/action-telegram@v1
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: |
            Deployment started
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}


      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build Docker Image
        run: |
          docker build -t $DOCKER_IMAGE .
      
      - name: Push Docker Image
        run: |
          docker push $DOCKER_IMAGE

      - name: Get ip from inventory
        run: |
          IP=$(grep -oE '([0-9]){1,3}\.{3}[0-9]{1,3}' infra/ansible/inventory)
          echo "IP=$IP" >> $GITHUB_ENV
      
      - name: Set up SSH
        run: |
          echo "${{ secrets.GCP_SSH_KEY }}" > key.pem
          chmod 600 key.pem
      
      - name: Deploy via SSH
        run: |
          ssh -o StrictHostKeyChecking=no -i key.pem ${{ secrets.GCP_USER }}@${{ env.EXTERNAL_IP }} << EOF
          echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
          docker compose -f ~/bot/docker-compose.yml down || true
          cd ~/bot
          git pull origin main
          docker compose -f ~/bot/docker-compose.yml up -d --build
          EOF
      
      - name: Notify Telegram Deployment Completion
        if: always()
        uses: appleboy/telegram-action@v1
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: |
            ${{ job.status == 'success' && 'Deployment completed successfully!' || 'Deployment failed.' }}
            Status: ${{ job.status }}