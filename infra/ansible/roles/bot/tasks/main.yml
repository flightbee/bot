---
- name: Copy bot source code
  synchronize:
    src: ../../../../
    dest: "{{ bot_dir }}"
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=infra"
      - "--exclude=.github"

- name: Copy .env file
  copy:
    src: ../../../../.env
    dest: "{{ bot_dir }}/.env"

- name: Restart bot container
  shell: |
    cd {{ bot_dir }}
    docker compose down || true
    docker compose up -d --build
