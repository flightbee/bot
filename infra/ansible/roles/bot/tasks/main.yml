---
- name: Clone bot repository
  git:
    repo: 'https://github.com/flightbee/bot.git'
    dest: "{{ bot_dir }}"
    version: main
    force: yes
    recursive: yes

- name: Verify docker-compose file exists
  stat:
    path: "{{ bot_dir }}/docker-compose.yml"
  register: compose_file

- name: Copy .env file to server
  copy:
    src: "{{ lookup('env', 'HOME') }}/.env"
    dest: "{{ bot_dir }}/.env"
    remote_src: false
    owner: "{{ ansible_user }}"
    mode: '0600'

- name: Set correct permissions for .env
  file:
    path: "{{ bot_dir }}/.env"
    owner: "{{ ansible_user }}"
    mode: '0600'

- name: Build and run Docker containers
  community.docker.docker_compose:
    project_src: "{{ bot_dir }}"
    build: yes
    pull: yes
    state: present