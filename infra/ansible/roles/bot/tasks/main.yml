---
- name: Clone bot repository
  git:
    repo: 'https://github.com/flightbee/bot.git'
    dest: "{{ bot_dir }}"
    version: main
    force: yes
    recursive: yes

- name: Verify docker-compose file exists
  stat:
    path: "{{ bot_dir }}/docker-compose.yml"
  register: compose_file

- name: Fail if docker-compose file not found
  fail:
    msg: "docker-compose.yml not found in {{ bot_dir }}"
  when: not compose_file.stat.exists

#- name: Transfer .env from Terraform VM to target
#  shell: |
#    ssh -i ~/.ssh/id_ed25519 \
#      -o StrictHostKeyChecking=no \
#      dmitri_torchilo@{{ terraform_vm_ip }} \
#      "cat /home/dmitri_torchilo/bot/.env" > {{ bot_dir }}/.env
#  args:
#    executable: /bin/bash
#  when: inventory_hostname != 'localhost'

- name: Set correct permissions for .env
  file:
    path: "{{ bot_dir }}/.env"
    owner: "{{ ansible_user }}"
    mode: '0600'

#- name: Build and run Docker containers
  community.docker.docker_compose:
    project_src: "{{ bot_dir }}"
    build: yes
    pull: yes
    remove_orphans: yes
    state: present

- name: Stop and remove existing containers
  community.docker.docker_compose:
    project_src: "{{ bot_dir }}"
    state: absent
  ignore_errors: yes

- name: Build and start containers
  community.docker.docker_compose:
    project_src: "{{ bot_dir }}"
    build: yes
    pull: yes
    remove_orphans: yes
    state: present

- name: Ensure containers are restarted (if needed)
  community.docker.docker_compose:
    project_src: "{{ bot_dir }}"
    restarted: yes