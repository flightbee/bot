---
- name: Clone bot repository
  git:
    repo: 'https://github.com/flightbee/bot.git'
    dest: "{{ bot_dir }}"
    version: main
    force: yes
    recursive: yes

- name: Verify docker-compose file exists
  stat:
    path: "{{ bot_dir }}/docker-compose.yml"
  register: compose_file

- name: Fail if docker-compose file not found
  fail:
    msg: "docker-compose.yml not found in {{ bot_dir }}"
  when: not compose_file.stat.exists

- name: Copy local .env to remote (from Terraform VM)
  copy:
    src: "{{ playbook_dir }}/.env"  # Локальный .env (будет скопирован с Terraform VM)
    dest: "{{ bot_dir }}/.env"
    owner: "{{ ansible_user }}"
    mode: '0600'

- name: Build and run Docker containers
  community.docker.docker_compose:
    project_src: "{{ bot_dir }}"
    build: yes
    pull: yes
    restart: yes
    remove_orphans: yes
    state: present